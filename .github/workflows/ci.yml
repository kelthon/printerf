name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # Bibliotecas de sistema da libcosmic (Wayland/X11/fontes) + libcups + poppler.
  APT_DEPS: >-
    pkg-config libxkbcommon-dev libwayland-dev libexpat1-dev libfontconfig-dev
    libfreetype-dev libcups2-dev poppler-utils fonts-dejavu-core

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: Lint (clippy)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends $APT_DEPS
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --locked --all-targets -- -D warnings

  test:
    name: Unit + E2E tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      # `cups` traz cupsd/lpadmin para o cupsd privado dos testes e2e.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends $APT_DEPS cups
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Unit tests
        run: cargo test --locked --lib --bins
      - name: E2E tests (cupsd privado)
        env:
          PRINTERF_E2E_REQUIRED: "1"
        run: cargo test --locked --test e2e_cups -- --nocapture

  build:
    name: Release build
    runs-on: ubuntu-24.04
    needs: [fmt, clippy, test]
    permissions:
      contents: write # anexar binário a releases de tags v*
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends $APT_DEPS
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked --release
      - name: Package
        run: |
          name="printerf-${GITHUB_REF_NAME//\//-}-x86_64-linux"
          mkdir -p "dist/$name"
          cp target/release/printerf README.md "dist/$name/"
          cp -r res "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          echo "ARCHIVE=dist/$name.tar.gz" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: printerf-x86_64-linux
          path: ${{ env.ARCHIVE }}
      - name: Publish release (tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ARCHIVE }}
          generate_release_notes: true
