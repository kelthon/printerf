    <path d="M234 238c-2.216 0-4 1.784-4 4v18c0 2.216 1.784 4 4 4h44c2.216 0 4-1.784 4-4v-18c0-2.216-1.784-4-4-4zm0 1h44c1.662 0 3 1.338 3 3v16c0 1.662-1.338 3-3 3h-44c-1.662 0-3-1.338-3-3v-16c0-1.662 1.338-3 3-3z" fill="#fff" fill-opacity=".35"/>
